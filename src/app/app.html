<div style="padding:30px; background:#f5f7fa; min-height:100vh;">

  <mat-card style="padding:20px; margin-bottom:20px;">
    <h2> Car Explorer Dashboard</h2>

    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:15px;">

      <!-- Search -->
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="filters.search" (input)="onSearchChange()">
      </mat-form-field>

      <!-- Make -->
      <mat-form-field appearance="outline">
        <mat-label>Make</mat-label>
        <mat-select [(ngModel)]="filters.make" (selectionChange)="onSearchChange()">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let m of makes" [value]="m">{{ m }}</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Fuel -->
      <mat-form-field appearance="outline">
        <mat-label>Region</mat-label>
        <mat-select [(ngModel)]="filters.fuel" (selectionChange)="onSearchChange()">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let f of fuels" [value]="f">{{ f }}</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Sort -->
      <mat-form-field appearance="outline">
        <mat-label>Sort By</mat-label>
        <mat-select [(ngModel)]="filters.sortBy" (selectionChange)="onSearchChange()">
          <mat-option value="">None</mat-option>
          <mat-option value="mpg">MPG</mat-option>
          <mat-option value="horsepower">Horsepower</mat-option>
          <mat-option value="year">Year</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Order -->
      <mat-form-field appearance="outline">
        <mat-label>Order</mat-label>
        <mat-select [(ngModel)]="filters.order" (selectionChange)="onSearchChange()">
          <mat-option value="asc">Ascending</mat-option>
          <mat-option value="desc">Descending</mat-option>
        </mat-select>
      </mat-form-field>

    </div>
  </mat-card>

  <!-- Table -->
  <mat-card>

    <table mat-table [dataSource]="cars" class="mat-elevation-z2" style="width:100%">

      <ng-container matColumnDef="make">
        <th mat-header-cell *matHeaderCellDef> Make </th>
        <td mat-cell *matCellDef="let car"> {{car.make}} </td>
      </ng-container>

      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef> Model </th>
        <td mat-cell *matCellDef="let car"> {{car.model}} </td>
      </ng-container>

      <ng-container matColumnDef="year">
        <th mat-header-cell *matHeaderCellDef> Year </th>
        <td mat-cell *matCellDef="let car"> {{car.year}} </td>
      </ng-container>

      <ng-container matColumnDef="mpg">
        <th mat-header-cell *matHeaderCellDef> MPG </th>
        <td mat-cell *matCellDef="let car"> {{car.mpg}} </td>
      </ng-container>

      <ng-container matColumnDef="horsepower">
        <th mat-header-cell *matHeaderCellDef> HP </th>
        <td mat-cell *matCellDef="let car"> {{car.horsepower}} </td>
      </ng-container>

      <ng-container matColumnDef="fuel">
        <th mat-header-cell *matHeaderCellDef> Region </th>
        <td mat-cell *matCellDef="let car"> {{car.fuel}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['make','model','year','mpg','horsepower','fuel']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['make','model','year','mpg','horsepower','fuel'];"></tr>

    </table>

  </mat-card>

  <!-- Pagination -->
  <div style="margin-top:20px; display:flex; justify-content:center; gap:10px;">

    <button mat-raised-button color="primary"
            (click)="prevPage()"
            [disabled]="filters.page <= 1">
      Previous
    </button>

    <span style="padding:10px;">
      Page {{ filters.page }} / {{ totalPages }}
    </span>

    <button mat-raised-button color="primary"
            (click)="nextPage()"
            [disabled]="filters.page >= totalPages">
      Next
    </button>

  </div>

</div>
